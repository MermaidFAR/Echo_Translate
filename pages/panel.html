<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echo Translate · 文本与 AI</title><link rel="stylesheet" href="../src/ui.css"></head><body class="compact"><header><a class="brand" href="panel.html">Echo Translate</a><nav><a href="options.html" target="_blank">设置</a><a href="documents.html" target="_blank">文件</a></nav></header><main><label for="mode">任务</label><select id="mode"><option value="translate">翻译</option><option value="explain">AI 解释与词典</option><option value="summarize">摘要</option><option value="rewrite">润色与改写</option><option value="reply">拟写回复</option><option value="terminology">提取术语并建立词表</option><option value="custom">自定义 AI 专家</option></select><div class="grid"><div><label for="source">源语言</label><input id="source" value="auto"></div><div><label for="target">目标语言</label><input id="target" value="zh-CN"></div></div><label for="instruction">本次任务要求（可选）</label><textarea id="instruction" rows="2" placeholder="例如：用学术论文的语气，保留术语缩写。"></textarea><label for="text">原文</label><textarea id="text" rows="9" placeholder="粘贴需要翻译、解释或改写的文字"></textarea><div class="row"><button id="run">开始</button><button id="cancel" class="secondary" disabled>取消</button><button id="copy" class="secondary">复制结果</button><button id="add-terms" class="secondary">结果加入术语库</button><button id="download" class="secondary">导出 TXT</button></div><div id="status" role="status"></div><div id="output" class="result" aria-live="polite"></div><footer>使用你在设置中配置的 API 和术语库。输入内容按所选任务发送给模型。</footer></main><script type="module" src="../src/panel.js"></script></body></html>
